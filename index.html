<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Variations Generator</title>
    <meta name="description" content="Generate Gmail dot-variations of your email address (e.g. j.ohn.doe@gmail.com) and export them to Excel.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Email Variations Generator</h1>
    <p class="subtitle">FEA in the URL is an abbreviation for: <a href="https://fadyehabamer.com">Fady Ehab Amer</a></p>
    <div>
        <label for="emailInput">Enter Email:</label>
        <input type="email" id="emailInput" autocomplete="email" aria-describedby="errorMsg">
        <section class="controls">
            <button onclick="generateAndDisplayVariations()">Generate Variations</button>
            <button id="exportBtn" onclick="exportToExcel()" disabled>Export to Excel</button>
        </section>
    </div>

    <p id="errorMsg" role="alert"></p>
    <p id="statusMsg" role="status"></p>

    <table id="results">
        <!-- The results will be displayed here in table format -->
    </table>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
